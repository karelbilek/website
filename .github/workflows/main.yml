name: Fly Deploy
on:
  push:
    branches:
      - master
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/karelbilek-website:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: set up gemini cert
        run: |
          echo "$GEMINI_CERT_PEM" > gemini-cert.pem
          echo "$GEMINI_KEY_RSA" > gemini-key.rsa
        env:
          GEMINI_CERT_PEM: ${{ secrets.GEMINI_CERT_PEM }}
          GEMINI_KEY_RSA: ${{ secrets.GEMINI_KEY_RSA }}
      - name: build image on the runner
        run: |
          flyctl auth docker
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
      - run: flyctl deploy --image "$IMAGE"
