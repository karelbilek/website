[package]
name = "website"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
html-escape = "0.3.1"
mime_guess = "2.0.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls-pki-types = "1.16.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
